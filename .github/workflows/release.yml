name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# changesets/action needs to push version commits/tags and open the Version PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; don't also pass `version`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The re-pin step shells out to the built CLI, so the versioning command
      # needs dist/ present (REQ-RELEASE-REPIN).
      - run: pnpm build

      # Opens/updates a "Version Packages" PR, or publishes @rqml/schema,
      # @rqml/core, rqml, and @rqml/mcp to npm when a release PR is merged.
      #
      # `version` overrides the default `changeset version` with the root script,
      # which bumps and then re-pins the drift baselines the bump invalidates —
      # so the Version Packages PR is green instead of landing drift on main
      # (REQ-RELEASE-REPIN). Scoped: it re-pins only manifests this bump touched,
      # and only when their diff is confined to versions and @rqml/* pins.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's registry-url writes _authToken=${NODE_AUTH_TOKEN} into the
          # .npmrc it activates via NPM_CONFIG_USERCONFIG, so the token must be
          # exposed under this name or npm publishes with a placeholder (E404).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
